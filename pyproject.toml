[project]
name = "paulo-skills-tooling"
version = "1.0.0"
description = "Local validation tools for the Paulo Skills collection."
requires-python = ">=3.11"
dependencies = [
    "skills-ref @ git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "editorconfig>=0.17",
    "filelock>=3.20,<4",
    "markdown-it-py>=4,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
